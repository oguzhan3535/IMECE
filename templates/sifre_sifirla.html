<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>İmece - Şifre Kurtarma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Geçiş animasyonları */
        body { transition: background-color 0.3s ease, color 0.3s ease; min-height: 100vh; position: relative; }
        .card { transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease; }
        
        /* === GECE MODU (DARK MODE) ÖZEL CSS'İ === */
        [data-bs-theme="dark"] body.bg-light { background-color: #121212 !important; color: #e0e0e0; }
        [data-bs-theme="dark"] .card { background-color: #1e1e1e !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important; }
        [data-bs-theme="dark"] .text-primary { color: #6ea8fe !important; }
        [data-bs-theme="dark"] .text-muted { color: #a0a0a0 !important; }
        [data-bs-theme="dark"] .form-label { color: #e0e0e0 !important; }
        [data-bs-theme="dark"] .form-control { background-color: #2b2b2b !important; border-color: #444 !important; color: #fff !important; }
        [data-bs-theme="dark"] .form-control::placeholder { color: #888 !important; }
        [data-bs-theme="dark"] .text-secondary { color: #bbb !important; }
    </style>
</head>
<body class="bg-light pt-5">

    <button class="btn btn-outline-secondary border-0 rounded-circle shadow-sm position-absolute top-0 end-0 m-4" id="themeToggle" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <i class="bi bi-moon-stars-fill fs-5" id="themeIcon"></i>
    </button>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 text-primary">Şifremi Unuttum</h2>
                        <p class="text-muted text-center small mb-4">E-posta adresinizi ve size özel kurtarma anahtarını girerek şifrenizi yenileyebilirsiniz.</p>
                        
                        <form action="/sifre-sifirla" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">E-posta Adresi</label>
                                <input type="email" name="email" class="form-control form-control-lg" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Kurtarma Anahtarı</label>
                                <input type="text" name="anahtar" class="form-control form-control-lg" placeholder="Örn: imece123" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Yeni Şifre</label>
                                <input type="password" name="yeni_sifre" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Şifreyi Sıfırla</button>
                        </form>
                        
                        <div class="mt-4 text-center">
                            <a href="/" class="text-secondary text-decoration-none small fw-bold">← Giriş Sayfasına Dön</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        // Sayfa açıldığında hafızadaki temayı kontrol et ve uygula
        const savedTheme = localStorage.getItem('imece_theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        updateIcon(savedTheme);

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                
                htmlElement.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('imece_theme', newTheme);
                updateIcon(newTheme);
            });
        }

        function updateIcon(theme) {
            if (!themeIcon || !themeToggleBtn) return;
            if(theme === 'dark') {
                themeIcon.classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
                themeIcon.classList.replace('text-secondary', 'text-warning');
                themeToggleBtn.classList.replace('btn-outline-secondary', 'btn-outline-warning');
            } else {
                themeIcon.classList.replace('bi-sun-fill', 'bi-moon-stars-fill');
                themeIcon.classList.replace('text-warning', 'text-secondary');
                themeToggleBtn.classList.replace('btn-outline-warning', 'btn-outline-secondary');
            }
        }
    </script>
</body>
</html>
