<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmece | Güvenli Ödeme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .payment-card { border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: #fff; padding: 40px; transition: background-color 0.3s ease; }
        .price-badge { background-color: #e8f5e9; color: #198754; font-size: 1.5rem; padding: 10px 20px; border-radius: 12px; font-weight: bold; }
        .card-input-bg { background-color: #f8f9fa; border: 1px solid #dee2e6; }
        .card-input-bg:focus { border-color: #198754; box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25); }

        /* === GECE MODU (DARK MODE) ÖZEL CSS'İ === */
        [data-bs-theme="dark"] body { background-color: #121212 !important; color: #e0e0e0; }
        [data-bs-theme="dark"] .bg-light, [data-bs-theme="dark"] .payment-card { background-color: #1e1e1e !important; color: #e0e0e0 !important; border-color: #333 !important; }
        [data-bs-theme="dark"] .text-dark, [data-bs-theme="dark"] h3, [data-bs-theme="dark"] h5 { color: #ffffff !important; }
        [data-bs-theme="dark"] .text-muted, [data-bs-theme="dark"] .text-secondary { color: #a0a0a0 !important; }
        [data-bs-theme="dark"] .card-input-bg, [data-bs-theme="dark"] .form-control { background-color: #2b2b2b !important; border-color: #444 !important; color: #fff !important; }
        [data-bs-theme="dark"] .form-control::placeholder { color: #888 !important; }
        [data-bs-theme="dark"] .input-group-text { background-color: #2b2b2b !important; border-color: #444 !important; color: #e0e0e0 !important; }
        [data-bs-theme="dark"] .price-badge { background-color: rgba(25, 135, 84, 0.15) !important; color: #a3cfbb !important; border: 1px solid #198754; }
    </style>
</head>
<body class="d-flex align-items-center py-5 bg-light" style="min-height: 100vh; position: relative;">

    <button class="btn btn-outline-secondary border-0 rounded-circle shadow-sm position-absolute top-0 end-0 m-4" id="themeToggle" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <i class="bi bi-moon-stars-fill fs-5" id="themeIcon"></i>
    </button>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="text-center mb-4">
                    <a href="/bagisci" class="text-decoration-none text-muted fw-bold"><i class="bi bi-arrow-left me-1"></i>Bağışçı Paneline Dön</a>
                </div>

                <div class="payment-card border-top border-5 border-success">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock-fill text-success" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold mt-2 text-dark">Güvenli Bağış Ekranı</h3>
                        <p class="text-muted">Yardım Türü: <strong class="text-success">{{ talep[1] }}</strong></p>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-light rounded-3 border">
                        <span class="fw-bold text-secondary">Birim Fiyatı:</span>
                        <span class="price-badge">{{ birim_fiyat }} TL</span>
                    </div>

                    <form action="/bagis_yap/{{ talep[0] }}" method="POST" id="odemeFormu" data-fiyat="{{ birim_fiyat }}">
                        
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Kaç Adet Karşılamak İstiyorsunuz?</label>
                            <input type="number" class="form-control form-control-lg bg-light fw-bold text-dark text-center" id="bagis_adet" name="bagis_adet" value="1" min="1" max="{{ kalan_limit }}" oninput="toplamHesapla()" required>
                            <div class="form-text text-danger fw-bold mt-2 text-center">* Karşılanması gereken kalan miktar: {{ kalan_limit }} Adet</div>
                        </div>

                        <h5 class="fw-bold mt-5 mb-3 border-bottom pb-2 text-dark"><i class="bi bi-credit-card-2-front text-secondary me-2"></i>Kredi / Banka Kartı Bilgileri</h5>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Kart Üzerindeki İsim</label>
                            <div class="input-group">
                                <span class="input-group-text card-input-bg border-end-0"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control card-input-bg border-start-0 ps-0 fw-bold" required placeholder="Örn: Oğuzhan Bağrıaçık">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Kart Numarası</label>
                            <div class="input-group">
                                <span class="input-group-text card-input-bg border-end-0"><i class="bi bi-credit-card"></i></span>
                                <input type="text" class="form-control card-input-bg border-start-0 ps-0 fw-bold" required placeholder="0000 0000 0000 0000" maxlength="19">
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold text-uppercase">Son Kullanma</label>
                                <input type="text" class="form-control card-input-bg text-center fw-bold" required placeholder="AA/YY" maxlength="5">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold text-uppercase">CVV</label>
                                <input type="password" class="form-control card-input-bg text-center fw-bold" required placeholder="***" maxlength="3">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 border-top pt-4">
                            <span class="fw-bold fs-5 text-dark">Ödenecek Toplam Tutar:</span>
                            <span class="fw-bold fs-3 text-success" id="gosterilen_toplam">{{ birim_fiyat }} TL</span>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm"><i class="bi bi-check-circle-fill me-2"></i>Bağışı Tamamla</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function toplamHesapla() {
            var formElement = document.getElementById('odemeFormu');
            var sistemBirimFiyat = parseFloat(formElement.getAttribute('data-fiyat'));
            var adet = document.getElementById('bagis_adet').value;
            
            if(adet < 1) adet = 1; 
            var toplam = adet * sistemBirimFiyat;
            document.getElementById('gosterilen_toplam').innerText = toplam + " TL";
        }
    </script>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('imece_theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        updateIcon(savedTheme);

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                
                htmlElement.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('imece_theme', newTheme);
                updateIcon(newTheme);
            });
        }

        function updateIcon(theme) {
            if (!themeIcon || !themeToggleBtn) return;
            if(theme === 'dark') {
                themeIcon.classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
                themeIcon.classList.replace('text-secondary', 'text-warning');
                themeToggleBtn.classList.replace('btn-outline-secondary', 'btn-outline-warning');
            } else {
                themeIcon.classList.replace('bi-sun-fill', 'bi-moon-stars-fill');
                themeIcon.classList.replace('text-warning', 'text-secondary');
                themeToggleBtn.classList.replace('btn-outline-warning', 'btn-outline-secondary');
            }
        }
    </script>
</body>
</html>
