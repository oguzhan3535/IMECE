<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmece | Sisteme Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .register-card { border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: background-color 0.3s ease, box-shadow 0.3s ease; }
        .brand-text { color: #198754; font-weight: 900; font-size: 2rem; letter-spacing: -1px; }

        /* === YENİ: ÖZEL ARAMA LİSTESİ CSS === */
        .custom-dropdown-menu { max-height: 200px; overflow-y: auto; display: none; position: absolute; top: 100%; left: 0; z-index: 1050; border-radius: 0 0 10px 10px; border: 1px solid #e9ecef; border-top: none; width: 100%; }
        .custom-dropdown-item { padding: 8px 15px; cursor: pointer; transition: 0.2s; }
        .custom-dropdown-item:hover { background-color: #e9ecef; color: #198754; font-weight: bold; }

        /* === GECE MODU (DARK MODE) ÖZEL CSS'İ === */
        [data-bs-theme="dark"] body.bg-light { background-color: #121212 !important; color: #e0e0e0; }
        [data-bs-theme="dark"] .bg-white, [data-bs-theme="dark"] .bg-light { background-color: #1e1e1e !important; color: #e0e0e0 !important; }
        [data-bs-theme="dark"] .register-card { background-color: #1e1e1e !important; box-shadow: 0 5px 15px rgba(0,0,0,0.3) !important; }
        [data-bs-theme="dark"] .text-dark, [data-bs-theme="dark"] h4 { color: #ffffff !important; }
        [data-bs-theme="dark"] .text-muted { color: #a0a0a0 !important; }
        [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select { background-color: #2b2b2b !important; border-color: #444 !important; color: #fff !important; }
        [data-bs-theme="dark"] .form-control::placeholder { color: #888 !important; }
        [data-bs-theme="dark"] .input-group-text { background-color: #2b2b2b !important; border-color: #444 !important; color: #e0e0e0 !important; }
        
        [data-bs-theme="dark"] .custom-dropdown-menu { background-color: #2b2b2b !important; border-color: #444 !important; }
        [data-bs-theme="dark"] .custom-dropdown-item { color: #e0e0e0; }
        [data-bs-theme="dark"] .custom-dropdown-item:hover { background-color: #333 !important; color: #20c997 !important; }
    </style>
</head>
<body class="d-flex align-items-center py-4 bg-light" style="min-height: 100vh; position: relative;">

    <button class="btn btn-outline-secondary border-0 rounded-circle shadow-sm position-absolute top-0 end-0 m-4" id="themeToggle" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <i class="bi bi-moon-stars-fill fs-5" id="themeIcon"></i>
    </button>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                
                <div class="text-center mb-4">
                    <a href="/" class="text-decoration-none brand-text"><i class="bi bi-heart-pulse-fill me-2"></i>İMECE</a>
                    <p class="text-muted mt-2 fw-bold">İyilik hareketine hemen katılın</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} fw-bold text-center shadow-sm"><i class="bi bi-info-circle-fill me-2"></i>{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="card register-card bg-white p-4 p-md-5 border-top border-5 border-success">
                    <h4 class="fw-bold mb-4 text-center">Hesap Oluştur</h4>
                    
                    <form action="/kayit" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Adınız Soyadınız / İşletme Adı</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control bg-light border-0" name="adsoyad" required placeholder="Örn: Oğuzhan Bağrıaçık">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">E-Posta Adresi</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-light border-0" name="email" required placeholder="ornek@mail.com">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Güvenli Şifre</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control bg-light border-0" name="sifre" required placeholder="••••••••">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Şifre Kurtarma Anahtarı</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-shield-lock"></i></span>
                                <input type="text" class="form-control bg-light border-0" name="anahtar" required placeholder="Örn: imece123">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Bulunduğunuz Şehir</label>
                            <div class="input-group position-relative">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-geo-alt-fill text-danger"></i></span>
                                <input type="text" name="sehir" id="sehirSecimi" class="form-control bg-light border-0 fw-bold" required placeholder="Şehrinizi yazın..." autocomplete="off">
                                <div id="sehirListesi" class="custom-dropdown-menu bg-white shadow-sm">
                                    </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Hesap Türünüz</label>
                            <select class="form-select bg-light border-0" name="rol" required>
                                <option value="" selected disabled>Lütfen seçiniz...</option>
                                <option value="IhtiyacSahibi">İhtiyaç Sahibiyim</option>
                                <option value="Bagisci">Bağışçıyım</option>
                                <option value="Esnaf">Esnafım (Teslimat Noktası)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3 shadow-sm">Sisteme Kayıt Ol</button>
                        
                        <div class="text-center">
                            <span class="text-muted small">Zaten hesabınız var mı?</span>
                            <a href="/" class="text-success fw-bold small text-decoration-none ms-1">Giriş Yap</a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script>
        const iller = [
            "Adana", "Adıyaman", "Afyonkarahisar", "Ağrı", "Amasya", "Ankara", "Antalya", "Artvin", "Aydın", "Balıkesir", "Bilecik", "Bingöl", "Bitlis", "Bolu", "Burdur", "Bursa", "Çanakkale", "Çankırı", "Çorum", "Denizli", "Diyarbakır", "Edirne", "Elazığ", "Erzincan", "Erzurum", "Eskişehir", "Gaziantep", "Giresun", "Gümüşhane", "Hakkari", "Hatay", "Isparta", "Mersin", "İstanbul", "İzmir", "Kars", "Kastamonu", "Kayseri", "Kırklareli", "Kırşehir", "Kocaeli", "Konya", "Kütahya", "Malatya", "Manisa", "Kahramanmaraş", "Mardin", "Muğla", "Muş", "Nevşehir", "Niğde", "Ordu", "Rize", "Sakarya", "Samsun", "Siirt", "Sinop", "Sivas", "Tekirdağ", "Tokat", "Trabzon", "Tunceli", "Şanlıurfa", "Uşak", "Van", "Yozgat", "Zonguldak", "Aksaray", "Bayburt", "Karaman", "Kırıkkale", "Batman", "Şırnak", "Bartın", "Ardahan", "Iğdır", "Yalova", "Karabük", "Kilis", "Osmaniye", "Düzce"
        ];

        const sehirSecimi = document.getElementById('sehirSecimi');
        const sehirListesi = document.getElementById('sehirListesi');

        function listeyiDoldur(arama = '') {
            sehirListesi.innerHTML = '';
            const val = arama.toLocaleLowerCase('tr-TR');
            const filtrelenenler = iller.filter(il => il.toLocaleLowerCase('tr-TR').includes(val));
            
            if (filtrelenenler.length > 0) {
                filtrelenenler.forEach(il => {
                    const div = document.createElement('div');
                    div.className = 'custom-dropdown-item';
                    div.textContent = il;
                    div.onclick = function() {
                        sehirSecimi.value = il;
                        sehirListesi.style.display = 'none';
                    };
                    sehirListesi.appendChild(div);
                });
                sehirListesi.style.display = 'block';
            } else {
                sehirListesi.style.display = 'none';
            }
        }

        sehirSecimi.addEventListener('input', function() { listeyiDoldur(this.value); });
        sehirSecimi.addEventListener('focus', function() { listeyiDoldur(this.value); });
        
        // Dışarı tıklanınca listeyi kapat
        document.addEventListener('click', function(e) {
            if (e.target !== sehirSecimi && e.target !== sehirListesi) { sehirListesi.style.display = 'none'; }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('imece_theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        updateIcon(savedTheme);

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                
                htmlElement.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('imece_theme', newTheme);
                updateIcon(newTheme);
            });
        }

        function updateIcon(theme) {
            if (!themeIcon || !themeToggleBtn) return;
            if(theme === 'dark') {
                themeIcon.classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
                themeIcon.classList.replace('text-secondary', 'text-warning');
                themeToggleBtn.classList.replace('btn-outline-secondary', 'btn-outline-warning');
            } else {
                themeIcon.classList.replace('bi-sun-fill', 'bi-moon-stars-fill');
                themeIcon.classList.replace('text-warning', 'text-secondary');
                themeToggleBtn.classList.replace('btn-outline-warning', 'btn-outline-secondary');
            }
        }
    </script>
</body>
</html>
